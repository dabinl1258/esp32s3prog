<!DOCTYPE html>
<html>

<body>

	<input type="file" id="fileInput">
	<button type="button" onclick="uploadFile()">업로드</button>
	<button type="button" onclick="program()">Program</button>
	<button type="button" onclick="erase()">Erase</button>
	<button type="button" onclick="verify()">Verify</button>
	<button type="button" onclick="test()">Auto</button>
	<button type="button" onclick="run()">Run</button>
	<button type="button" onclick="check_status()">결과 확인</button>
	<br></br>
	<textarea id="logScreen" readonly></textarea>

	<script>
		function addLog(message) {
			const logScreen = document.getElementById('logScreen');
			const now = new Date();
			const timeString = now.toLocaleTimeString(); // 현재 시간 가져오기

			// 기존 내용 뒤에 새로운 메시지와 줄바꿈(\n)을 추가한다곰
			logScreen.value += `[${timeString}] ${message}\n`;
			// 글이 많아지면 자동으로 맨 아래로 스크롤을 내려준다곰!
			logScreen.scrollTop = logScreen.scrollHeight;
		}
		function uploadFile() {
			const fileInput = document.getElementById('fileInput');
			const file = fileInput.files[0];

			if (!file) {
				alert("plz select file!");
				return;
			}

			fetch('/upload', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/octet-stream',
					'X-File-Name': encodeURIComponent(file.name)
				},
				body: file
			})
				.then(response => addLog("Upload done"))
				.catch(error => addLog("Upload Error"));
		}

		function program() {
			fetch('/program', {
				method: 'POST',

			})
				.then(response => addLog("program command sent"))
				.catch(error => addLog("program command error"));


		}
		function erase() {
			fetch('/erase', {
				method: 'POST',

			})
				.then(response => addLog("erase Done!"))
				.catch(error => addLog("erase Error"));
		}
		function verify() {
			fetch('/verify', {
				method: 'POST',

			})
				.then(response => addLog("verify Done!"))
				.catch(error => addLog("verify Error"));
		}
		function test() {
			fetch('/test', {
				method: 'POST',

			})
				.then(response => addLog("try test"))
				.catch(error => addLog("test Error"));


		}
		function run() {
			fetch('/run', {
				method: 'POST',

			})
				.then(response => addLog("try run"))
				.catch(error => addLog("test Error"));


		}
		function check_status() {

			fetch('/status', {
				method: 'POST',

			}).then(response => {
				return response.text();
			})
				.then(data => addLog(data))
				.catch(error => addLog("auto Error"));


		}
	</script>

</body>

</html>
