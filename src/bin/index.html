<!DOCTYPE html>
<html>

<body>

	<input type="file" id="fileInput">
	<button type="button" onclick="uploadFile()">업로드</button>
	<button type="button" onclick="program()">Program</button>
	<button type="button" onclick="erase()">Erase</button>
	<button type="button" onclick="verify()">Verify</button>
	<button type="button" onclick="auto()">Auto</button>

	<script>
		function uploadFile() {
			const fileInput = document.getElementById('fileInput');
			const file = fileInput.files[0];

			if (!file) {
				alert("plz select file!");
				return;
			}

			fetch('/upload', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/octet-stream',
					'X-File-Name': encodeURIComponent(file.name)
				},
				body: file
			})
				.then(response => alert("Upload Done!"))
				.catch(error => alert("Upload Error"));
		}
