[package]
edition      = "2024"
name         = "esp32s3prog"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32s3prog"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "1.1.1", features = ["defmt", "esp32c6", "unstable"] }


defmt                  = "1.0.1"

esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32c6"] }

critical-section = "1.2.0"
#esp-println = { version = "0.17.0", default-features = false, features = ["esp32c6", "log-04",  "uart"] }
esp-println      = { version = "0.17.0", features = ["defmt-espflash", "esp32c6", "uart" ], default-features = false }
embedded-hal = "1.0.0"
embedded-cli = "0.2.1"
embedded-io = "0.6.1"
ufmt = "0.2.0"
# embassy-net = "0.9.1"
embassy-executor = "0.10.0"
esp-rtos = {version = "0.3.0", features = ["esp32c6", "embassy",  "esp-alloc", "esp-radio"]}
esp-radio = {version ="0.18.0", features = ["esp32c6", "wifi", "esp-alloc"]}
esp-phy = { version = "0.2.0", features = ["esp32c6"] }
esp-alloc = { version = "0.10.0", features = ["esp32c6"] }
embassy-net = {version = "0.9.1", features =  ["proto-ipv4", "dhcpv4", "medium-ethernet","dns", "tcp" , "defmt"]}
embassy-time = "0.5.1"
static_cell = "2.1.1"
esp-backtrace = {version = "0.19.0", features = ["esp32c6", "defmt"]}



# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
